$('ruletext').textContent="1. <벽바둑 2>는 게임판 위에 벽을 세워 자신의 영역을 가장 넓게 만들어야 하는 게임이다.\n2. 각 플레이어에게는 사각 말, 원형 말이 하나씩 지급된다.\n   - 사각 말: 상하좌우 한 방향으로 1~2칸 이동할 수 있다.\n   - 원형 말: 상하좌우 한 칸 이동할 수 있고, 왼쪽/오른쪽으로 방향을 전환해 1칸 더 이동할 수 있다.\n3. 2인 모드는 상대 한 명과 결승 규칙으로 한 판을 진행한다. 3인 모드는 총 2라운드로 진행하며 1라운드는 3인전으로, 2라운드는 2인전으로 진행한다.\n4. 선 플레이어부터 순서대로 사각/원형 말 중 하나를 선택해 게임판 위 원하는 빈 칸에 배치한다. 두 번째 말 놓기는 역순으로 진행한다.\n5. 자신의 순서에는 제한 시간 90초 안에 말 이동과 벽 설치를 차례대로 진행한다.\n6. 말 이동: 자신의 말 하나를 선택해 이동시킨다.\n   - 이미 다른 말이 있는 칸으로는 이동할 수 없다.\n   - 말의 이동 경로에 벽이 존재한다면 해당 방향으로는 이동할 수 없다.\n     - 단, 1라운드에 한하여 각 플레이어는 게임 중 단 한 번, 벽 부수기를 할 수 있다.\n     - 벽 부수기: 이동 경로에 있는 벽을 하나 부수고 이동할 수 있다.\n7. 벽 설치: 말 이동을 마친 말의 상하좌우 면 중 한 곳에 벽을 반드시 설치한다.\n   - 이미 벽이 세워진 면에는 벽을 세울 수 없다.\n   - 제한 시간을 초과한 경우 임의의 면에 벽이 설치된다.\n8. 각 플레이어들의 말이 있는 영역이 벽으로 인해 모두 분리되면 즉시 게임이 종료된다. 이때, 벽 부수기를 사용하지 않은 플레이어가 있어도 게임은 종료된다.\n9. 게임 종료 시 각 플레이어들의 말이 속한 영역의 칸 수를 합산하고, 가장 넓은 영역을 만든 플레이어의 생존이 확정된다.\n   - 동률일 경우, 더 넓은 영역의 칸 수를 비교하여 순위를 결정한다.\n10. 2라운드는 1라운드의 생존 확정자를 제외한 두 플레이어의 1:1 승부로 진행한다. 기본 규칙은 위와 동일하나 다음의 변경 사항들이 적용된다.\n    - 선 플레이어는 1라운드에서 더 영역을 넓게 확보한 플레이어가 된다.\n    - 각자 사각 말 2개, 원형 말 2개를 가지고 시작하며, 이 중 원형 말 2개는 시작 위치가 사전에 지정되어 있다.\n    - '벽 부수기'를 사용할 수 없다.\n11. 2라운드에서 패배한 플레이어는 탈락한다.\n\n이 사이트에서는 2라운드 원형 말을 B2·B6 / F2·F6에 둔다. 첫 대국 순서는 추첨으로 정한다. 이동할 수 없는 참가자는 차례를 넘기며 전원이 움직일 수 없으면 단독 소유 영역을 집계한다. 합계와 최대 영역까지 공동 선두이면 해당 참가자끼리 재대국한다. 시간 초과 시 이동 전이면 자동 이동 후 벽을 설치한다.";

function diagram(type){
 const scoring=type==='score',n=scoring?7:5,step=140/n;let svg='';
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){
  const dx=Math.abs(x-2),dy=Math.abs(y-2);
  const possible=type==='round'?Math.max(dx,dy)===1:type==='square'?(dx===0)!==(dy===0):false;
  const fill=scoring?(x<2?'#ffe78b':y<3?'#ffc5c0':'#bdd7fc'):possible?'#ffe78b':'#faf9f4';
  svg+=tile(step*x,step*y,step,fill);
  if(possible)svg+='<circle cx="'+(x+.5)*step+'" cy="'+(y+.5)*step+'" r="3" fill="#444"/>';
 }
 if(scoring)return svg+'<path d="M40 0V140" stroke="#c89500" stroke-width="4"/><path d="M40 60H140" stroke="#de675f" stroke-width="4"/><g stroke="#222"><circle cx="10" cy="10" r="6" fill="#facb00"/><rect x="123" y="3" width="13" height="13" fill="#f57367"/><circle cx="130" cy="130" r="6" fill="#68a0eb"/></g><g font-size="24" font-weight="bold" text-anchor="middle"><text x="20" y="78">14</text><text x="90" y="38">15</text><text x="90" y="108">20</text></g>';
 if(type==='wall')svg+='<rect x="56" y="56" width="28" height="28" fill="none" stroke="#c89500" stroke-width="5" stroke-dasharray="23 5"/>';
 return svg+(type==='square'?'<rect x="61" y="61" width="18" height="18"':'<circle cx="70" cy="70" r="9"')+' fill="#333"/>';
}
